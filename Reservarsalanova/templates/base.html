<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar Sala</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #1d2733; }
    header { background: #1f3a5f; padding: 12px 24px; }
    nav a { color: #ffffff; margin-right: 20px; text-decoration: none; font-weight: bold; }
    nav a:hover, nav a:focus { text-decoration: underline; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 1rem; }
    button, .botao { background: #1f3a5f; color: #fff; border: 0; padding: 10px 18px; margin-top: 16px;
                     font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
    button.recusar { background: #8a1c1c; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #d5dbe1; }
    .aviso { padding: 10px 14px; margin-bottom: 16px; border-left: 6px solid; background: #fff; }
    .aviso.ok { border-color: #1b7a3d; }
    .aviso.erro { border-color: #8a1c1c; }
    .caixa { background: #fff; padding: 16px; margin-bottom: 16px; }
    .linha { display: flex; gap: 12px; flex-wrap: wrap; }
    .linha > div { flex: 1; min-width: 140px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ url_for('inicio') }}">Início</a>
      <a href="{{ url_for('nova_solicitacao') }}">CAEX: nova solicitação</a>
      <a href="{{ url_for('status') }}">CAEX: status</a>
      <a href="{{ url_for('admin') }}">Administração</a>
      <a href="{{ url_for('salas') }}">Salas</a>
    </nav>
  </header>
  <main>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensagens %}
        <div class="aviso {{ categoria }}" role="alert">
          <strong>{{ 'Erro:' if categoria == 'erro' else 'Tudo certo:' }}</strong> {{ texto }}
        </div>
      {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
